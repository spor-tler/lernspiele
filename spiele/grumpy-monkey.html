<!DOCTYPE html>
<html lang="de" data-theme="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grumpy Monkey – School Games</title>
<meta name="lernspiel:titel" content="Grumpy Monkey">
<meta name="lernspiel:thema" content="Grammatik-Mix 1. Klasse">
<meta name="lernspiel:stufe" content="5. Schulstufe">
<meta name="lernspiel:fach" content="Englisch (Grammatik)">
<meta name="lernspiel:beschreibung" content="Schleudere grantige Affen auf die Bananen-Diebe! Angry-Birds-Physik mit 9 Themen der 1. Klasse (Numbers, Plurals, Prepositions, there is/are, to be, have got, can, possessive 's, Present Simple). Keine Affen mehr? Frage beantworten und nachladen. Standard und AHS, Spezial-Affen, 27 Stages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root, :root[data-theme="standard"] {
  --color-primary-blue:#2563EB; --color-primary-yellow:#FACC15; --color-primary-green:#16A34A;
  --color-primary-red:#DC2626; --color-primary-purple:#9333EA;
  --color-bg-main:#FFF9F0; --color-bg-card:#FFFFFF; --color-bg-dark:#1E1B4B;
  --color-accent-orange:#F97316; --color-accent-pink:#EC4899; --color-accent-teal:#0D9488;
  --color-success:#22C55E; --color-error:#EF4444; --color-warning:#F59E0B; --color-info:#3B82F6;
  --color-text-dark:#1F2937; --color-text-light:#F9FAFB; --color-border:#E5E7EB;
  --shadow-card:4px 4px 0px #1F2937; --shadow-button:3px 3px 0px rgba(0,0,0,0.3); --shadow-hover:6px 6px 0px rgba(0,0,0,0.4);
  --font-heading:'Fredoka One','Nunito','Comic Sans MS',sans-serif; --font-body:'Nunito','Quicksand',sans-serif;
  --ease-pop:cubic-bezier(0.34,1.56,0.64,1);
  --header-bg:#1E1B4B; --header-fg:#F9FAFB; --card-fg:#1F2937; --letterbox:#BFE3F5;
}
:root[data-theme="psychedelic"] {
  --color-bg-main:#000000; --color-bg-card:#0D001A; --color-text-dark:#F9FAFB; --card-fg:#F9FAFB;
  --color-primary-blue:#BF00FF; --color-primary-green:#00C836; --color-primary-yellow:#FFFF00;
  --color-border:#BF00FF; --header-bg:#0D001A; --letterbox:#05000A;
  --shadow-card:0 0 20px #FF00FF, 0 0 40px #BF00FF; --shadow-button:0 0 12px #00FFFF, 0 0 24px #00FFFF; --shadow-hover:0 0 18px #00FFFF, 0 0 36px #00FFFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--color-bg-main);color:var(--color-text-dark);font-family:var(--font-body);font-size:16px;display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
button{font-family:var(--font-heading);cursor:pointer;border:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--color-accent-orange);outline-offset:2px}

/* ---------- HEADER ---------- */
header{height:64px;flex:none;display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--header-bg);color:var(--header-fg);border-bottom:4px solid #111827;z-index:5}
.hbtn{min-width:48px;height:48px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease-pop),box-shadow .15s}
.hbtn:hover{transform:scale(1.05)}
.hbtn:active{transform:translate(2px,2px)}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.htitle b{font-family:var(--font-heading);font-weight:400;font-size:24px;letter-spacing:.02em;color:#FACC15;white-space:nowrap}
.htitle span{font-size:14px;font-weight:800;letter-spacing:.03em;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--font-heading);font-size:22px;background:#FACC15;color:#1F2937;padding:8px 16px;border-radius:999px;border:3px solid #111827;min-width:112px;text-align:center}
.score.bump{animation:pop .3s var(--ease-pop)}
:root[data-theme="psychedelic"] .htitle b{animation:hue 3s linear infinite;color:#FF00FF;text-shadow:0 0 12px #FF00FF}
:root[data-theme="psychedelic"] .score{background:#000;color:#00FF41;border-color:#00FF41;box-shadow:0 0 12px #00FF41}

/* ---------- STAGE ---------- */
main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--letterbox)}
#wrap{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-card);border:4px solid #1F2937}
:root[data-theme="psychedelic"] #wrap{border-color:#FF00FF}
#game{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#game.drag{cursor:grabbing}

/* ---------- FOOTER ---------- */
footer{flex:none;height:56px;display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--header-bg);color:var(--header-fg);border-top:4px solid #111827}
.hearts{font-size:24px;letter-spacing:2px;white-space:nowrap}
.hearts .lost{filter:grayscale(1);opacity:.35}
.hearts.hit{animation:shake .3s}
.bar{flex:1;height:24px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;border:3px solid #111827;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16A34A,#FACC15);border-radius:999px;transition:width .6s var(--ease-pop)}
.bar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:900;letter-spacing:.03em;color:#fff;text-shadow:0 1px 2px #000}
.special{font-size:14px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:8px}
.special canvas{width:32px;height:32px}
:root[data-theme="psychedelic"] .bar i{background:linear-gradient(90deg,#FF00FF,#00FFFF,#00FF41,#FFFF00);background-size:200% 100%;animation:slide 2s linear infinite}

/* ---------- OVERLAYS ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(30,27,75,.55);overflow-y:auto}
.overlay.show{display:flex}
.card{background:var(--color-bg-card);color:var(--card-fg);border-radius:24px;border:4px solid #1F2937;box-shadow:var(--shadow-card);padding:24px;width:min(640px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;animation:popin .35s var(--ease-pop);text-align:center}
:root[data-theme="psychedelic"] .card{border-color:#FF00FF}
.card h2{font-family:var(--font-heading);font-weight:400;font-size:32px;margin-bottom:8px;color:var(--color-primary-purple)}
:root[data-theme="psychedelic"] .card h2{color:#00FFFF;text-shadow:0 0 12px #00FFFF}
.card p{font-size:18px;line-height:1.45;margin-bottom:16px}
.card.shake{animation:shake .3s}
.card.bounce{animation:bounce .45s var(--ease-pop)}
.btn{min-height:56px;padding:8px 24px;border-radius:16px;font-size:22px;color:#fff;background:var(--color-primary-blue);box-shadow:var(--shadow-button);border:3px solid #1F2937;transition:transform .15s var(--ease-pop),box-shadow .15s}
.btn:hover{transform:scale(1.05);box-shadow:var(--shadow-hover)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.green{background:var(--color-primary-green)}
.btn.orange{background:var(--color-accent-orange)}
.btn.ghost{background:#E5E7EB;color:#1F2937}
.btn.big{font-size:28px;min-height:64px;padding:8px 40px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

/* splash */
#splash{background:#1E1B4B;z-index:50;flex-direction:column;gap:16px}
#splash .logo{font-family:var(--font-heading);font-size:40px;color:#9333EA;text-shadow:0 0 0 #000;animation:popin .6s var(--ease-pop)}
#splash .star{font-size:64px;animation:spin 1.2s linear infinite}

/* menu */
#menu{background:linear-gradient(180deg,#8FD3F4 0%,#D8F1FB 60%,#FFF9F0 100%);z-index:30;align-items:flex-start}
:root[data-theme="psychedelic"] #menu{background:radial-gradient(circle at 50% 30%,#2A0040,#000 70%)}
.menu-inner{width:min(880px,100%);margin:auto;display:flex;flex-direction:column;gap:16px;padding:16px 0}
.title-box{display:flex;align-items:center;justify-content:center;gap:16px;animation:slidein .5s var(--ease-pop)}
.title-box canvas{width:112px;height:112px}
.game-title{font-family:var(--font-heading);font-size:56px;line-height:1;color:#FACC15;-webkit-text-stroke:3px #1F2937;text-shadow:4px 4px 0 #1F2937;letter-spacing:.02em}
:root[data-theme="psychedelic"] .game-title{color:#FF00FF;-webkit-text-stroke:0;text-shadow:0 0 16px #FF00FF,0 0 32px #BF00FF;animation:hue 3s linear infinite}
.tagline{font-size:20px;font-weight:900;color:#1F2937;text-align:center}
:root[data-theme="psychedelic"] .tagline{color:#00FFFF}
.panel{background:var(--color-bg-card);border:4px solid #1F2937;border-radius:24px;box-shadow:var(--shadow-card);padding:16px 24px;animation:slidein .5s var(--ease-pop) both}
.panel h3{font-family:var(--font-heading);font-weight:400;font-size:24px;margin-bottom:8px;color:var(--card-fg)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:56px;border-radius:16px;font-size:22px;background:#E5E7EB;color:#1F2937;border:3px solid #1F2937;transition:transform .15s var(--ease-pop)}
.seg button.on{background:var(--color-primary-purple);color:#fff;box-shadow:var(--shadow-button)}
.seg button small{display:block;font-family:var(--font-body);font-size:13px;font-weight:800}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.topic{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 16px;border-radius:16px;border:3px solid #1F2937;background:#F3F4F6;color:#1F2937;cursor:pointer;font-weight:800;font-size:16px;transition:transform .15s var(--ease-pop),background .15s}
.topic:hover{transform:scale(1.02)}
.topic .num{font-family:var(--font-heading);width:32px;height:32px;border-radius:999px;background:#9CA3AF;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.topic.on{background:#DCFCE7}
.topic.on .num{background:var(--color-primary-green)}
.topic .chk{margin-left:auto;font-size:20px}
.mini-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.mini{min-height:40px;padding:4px 16px;border-radius:999px;font-size:16px;background:#E5E7EB;color:#1F2937;border:3px solid #1F2937}
.noanim *,.noanim{animation:none !important}
.warn{color:var(--color-error);font-weight:900;min-height:24px}

/* map */
.map-grid{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:16px}
.map-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:16px;background:#F3F4F6;border:3px solid #1F2937}
:root[data-theme="psychedelic"] .map-row,:root[data-theme="psychedelic"] .topic{background:#14002A;color:#F9FAFB;border-color:#BF00FF}
.map-row .lbl{flex:1;font-weight:900;font-size:16px;min-width:0}
.map-row .lbl small{display:block;font-weight:700;font-size:13px;opacity:.8}
.sbtn{width:64px;min-height:48px;border-radius:16px;background:var(--color-primary-blue);color:#fff;border:3px solid #1F2937;font-size:18px;line-height:1;padding:4px}
.sbtn small{display:block;font-size:13px;letter-spacing:-1px}
.sbtn.done{background:var(--color-primary-green)}

/* question */
.q-head{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-block;padding:4px 16px;border-radius:999px;background:var(--color-primary-yellow);color:#1F2937;font-weight:900;font-size:14px;border:2px solid #1F2937;letter-spacing:.03em}
.chip.pink{background:var(--color-accent-pink);color:#fff}
.q-reason{font-family:var(--font-heading);font-size:22px;color:var(--color-accent-orange);margin-bottom:8px}
.q-instr{font-size:16px;font-weight:800;opacity:.8;margin-bottom:8px}
.q-text{font-size:24px;font-weight:800;line-height:1.4;margin-bottom:16px}
.gap{display:inline-block;min-width:72px;border-bottom:4px solid var(--color-primary-blue);margin:0 4px;color:var(--color-primary-blue)}
.opts{display:grid;gap:8px}
.opt{min-height:56px;border-radius:16px;font-family:var(--font-body);font-weight:900;font-size:22px;background:#EFF6FF;color:#1F2937;border:3px solid #1F2937;box-shadow:var(--shadow-button);transition:transform .15s var(--ease-pop)}
.opt:hover{transform:scale(1.03)}
.opt:active{transform:translate(2px,2px)}
.opt.right{background:var(--color-success);color:#fff}
.opt.wrong{background:var(--color-error);color:#fff}
:root[data-theme="psychedelic"] .opt{background:#14002A;color:#00FFFF;border-color:#00FFFF}
.scene{position:relative;width:260px;height:150px;margin:0 auto 16px;background:linear-gradient(#E0F2FE,#F0FDF4);border-radius:16px;border:3px solid #1F2937}
.scene span{position:absolute;line-height:1}
.build{min-height:64px;border:3px dashed #9CA3AF;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;min-height:56px}
.tile{min-height:48px;padding:4px 16px;border-radius:16px;font-family:var(--font-body);font-weight:900;font-size:20px;background:#FEF3C7;color:#1F2937;border:3px solid #1F2937;box-shadow:var(--shadow-button);animation:popin .25s var(--ease-pop)}
.tile:active{transform:translate(2px,2px)}
.build .tile{background:#DBEAFE}
.punct{font-weight:900;font-size:24px}
.tin{width:100%;min-height:56px;font-family:var(--font-body);font-size:24px;font-weight:800;padding:8px 16px;border-radius:16px;border:3px solid #1F2937;margin-bottom:16px;text-align:center;background:#fff;color:#1F2937}
.fb{margin-top:16px;padding:16px;border-radius:16px;font-size:18px;line-height:1.45;text-align:left;display:none}
.fb.show{display:block;animation:popin .3s var(--ease-pop)}
.fb.good{background:#DCFCE7;color:#14532D;border:3px solid #16A34A}
.fb.bad{background:#FEE2E2;color:#7F1D1D;border:3px solid #DC2626}
.fb b{font-weight:900}
.fb .ans{font-size:22px;font-weight:900;display:block;margin:4px 0 8px}
.stars{font-size:56px;letter-spacing:8px;margin:8px 0 16px}
.stars span{display:inline-block;filter:grayscale(1);opacity:.3}
.stars span.got{filter:none;opacity:1;animation:starpop .5s var(--ease-pop) both}
.rev{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;text-align:left}
.rev-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.rev-row .nm{width:200px;flex:none}
.rev-row .rb{flex:1;height:16px;border-radius:999px;background:#E5E7EB;overflow:hidden;border:2px solid #1F2937}
.rev-row .rb i{display:block;height:100%;background:var(--color-success)}
.rev-row .rb i.mid{background:var(--color-warning)}
.rev-row .rb i.low{background:var(--color-error)}

/* unlock banner */
#banner{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:16px;background:#1E1B4B;color:#fff;padding:16px 24px;border-radius:24px;border:4px solid #FACC15;box-shadow:0 0 0 4px #1F2937,8px 8px 0 #1F2937;pointer-events:none;max-width:calc(100% - 32px)}
#banner.show{display:flex;animation:bannerin .5s var(--ease-pop)}
#banner canvas{width:80px;height:80px;flex:none}
#banner b{font-family:var(--font-heading);font-weight:400;font-size:28px;color:#FACC15;display:block}
#banner span{font-size:16px;font-weight:800}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bannerin{0%{transform:translate(-50%,-160%) scale(.7)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.06,.94)}70%{transform:scale(.97,1.03)}100%{transform:scale(1)}}
@keyframes slidein{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes slide{to{background-position:200% 0}}
@media (max-width:640px){
  .htitle b{font-size:18px}.htitle span{font-size:12px}.score{font-size:16px;min-width:80px;padding:8px}
  .game-title{font-size:40px}.special .txt{display:none}.rev-row .nm{width:120px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important}
}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="backBtn" aria-label="Zurück">←</button>
  <div class="htitle"><b>Grumpy Monkey</b><span id="hsub">School Games</span></div>
  <div class="score" id="score">0</div>
  <button class="hbtn" id="muteBtn" aria-label="Ton an/aus">🔊</button>
  <button class="hbtn" id="psyBtn" aria-label="Psychedelic Mode">🌈</button>
</header>
<main><div id="wrap"><canvas id="game"></canvas></div></main>
<footer>
  <div class="hearts" id="hearts"></div>
  <div class="bar"><i id="barFill"></i><em id="barTxt"></em></div>
  <div class="special" id="special"></div>
</footer>

<div class="overlay show" id="splash"><div class="star">🌟</div><div class="logo">School Games 🎓</div></div>
<div class="overlay" id="menu"><div class="menu-inner" id="menuInner"></div></div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>
<div id="banner"></div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* =====================================================================
   GRUMPY MONKEY – School Games OG
   Angry-Birds-Prinzip (Matter.js) + Englisch-Grammatik 5. Schulstufe
   ===================================================================== */
const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- TEXTE (Standard = Deutsch, AHS = Englisch) ---------------- */
const TXT = {
  de: {

    reload3:'+3 Affen geladen!', reload1:'−1 ❤️ · +1 Affe', bonusOk:'+1 Stern ⭐', bonusNo:'Kein Leben verloren, nur kein 3. Stern.',
    placeholder:'Antwort eintippen…',
    clear:'Stage geschafft! 🐊💥', clearSub:'Alle Krokodile erwischt! Jetzt noch die Bonusfrage für den 3. Stern.', bonusBtn:'Bonusfrage ⭐',
    starsRule:'⭐ geschafft · ⭐ kein Leben verloren · ⭐ Bonusfrage richtig',
    retry:'Nochmal ↻', mapBtn:'Karte 🗺️', nextStage:'Weiter ▶',
    levelDone:'Level geschafft! ❤️ Leben wieder voll!',
    overT:'Keine Leben mehr! 😵', overS:"Die Krokodile lachen … noch! Die Stage startet neu mit 3 Leben.", again:'Nochmal!',
    finalT:'Alle Bananen gerettet! 🍌🏆', review:'Dein Themen-Rückblick', newGame:'Neues Spiel',
    unlocked:'NEUER AFFE!', dragHint:'Ziehen & loslassen!', tapHint:'Tippe im Flug!',
    nextSp:'Spezial-Affe in', correctW:'richtig', points:'Punkte', monkeysLeft:'Affen übrig',
    sp:{turbo:'Turbo-Affe: Tippe im Flug → TURBO! Kracht durch Holz.',
        triple:'Drillings-Affe: Tippe im Flug → teilt sich in 3! Super gegen Eis.',
        bomb:'Kokos-Bomben-Affe: Tippe → BUMM! Sprengt sogar Stein.',
        gorilla:'Mega-Gorilla: riesig und schwer! Tippe → Stampfer nach unten.'},
    std:'Standard', stdSub:'Mittelschule', ahs:'AHS', ahsSub:'Gymnasium'

/* ---------------- KOLLISION & SCHADEN ---------------- */
let pendingKill = new Set();
function onCollide(ev){
  if (simTime < 1.6) return;                      // Einschwingen: kein Schaden
  for (const p of ev.pairs){
    const a = p.bodyA, b = p.bodyB;
    const rel = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
    for (const [me, other] of [[a,b],[b,a]]){
      if (other.gm && other.gm.kind==='monkey' && other.gm.firstHit==null) other.gm.firstHit = simTime;
      if (!me.gm || me.gm.kind==='monkey' || pendingKill.has(me)) continue;
      if (rel < 1.5) continue;
      const om = other.isStatic ? 8 : clamp(other.mass, 0.5, 25);
      let dmg = (rel - 1.5) * om * 0.55;
      if (other.gm && other.gm.kind==='monkey'){
        if (other.gm.type==='turbo' && other.gm.boosted && me.gm.mat==='wood') dmg *= 3;
        if (other.gm.type==='triple' && me.gm.mat==='ice') dmg *= 3;
      }
      damage(me, dmg, rel);
    }
  }
}
function damage(b, dmg, rel=5){
  if (dmg <= 0.5 || pendingKill.has(b)) return;
  b.gm.hp -= dmg;
  if (b.gm.hp <= 0) pendingKill.add(b);
  else if (b.gm.kind==='block' && dmg > 4) SND.hit(b.gm.mat, rel > 8);
  if (b.gm.kind==='croc' && dmg > 3) b.gm.ouch = 0.5;
}
let hitStop = 0;
function processKills(){
  if (!pendingKill.size) return;
  let crocKilled = false;
  for (const b of pendingKill){
    Composite.remove(engine.world, b);
    const x = b.position.x, y = b.position.y;
    if (b.gm.kind==='croc'){
      crocs = crocs.filter(c => c !== b); crocKilled = true;
      addScore(5000, x, y - 30, '#16A34A');
      burst(x, y, 22, ['#6CC04A','#9BE36B','#FFFFFF'], 7, 'puff');
    } else {
      blocks = blocks.filter(c => c !== b);
      addScore(MAT[b.gm.mat].score, x, y, '#F97316', true);
      burst(x, y, 12, MAT[b.gm.mat].chips, 6, 'chip');
      SND.breakB(b.gm.mat);
      shake(3);
    }
  }
  pendingKill.clear();
  if (crocKilled){ SND.croc(); if (!REDUCE_MOTION) hitStop = 0.07; shake(6); }
}

function ability(){
  const b = projectiles.find(p => p.gm.main && !p.gm.used && !p.gm.dead);
  if (!b) return;
  const type = b.gm.type;
  if (type==='normal') return;
  if (type!=='bomb' && b.gm.firstHit != null) return;
  b.gm.used = true; SND.ability();
  if (type==='turbo'){
    const v = b.velocity, sp = Math.hypot(v.x, v.y) || 1, ns = Math.min(30, Math.max(22, sp*2));
    Body.setVelocity(b, { x:v.x/sp*ns, y:v.y/sp*ns }); b.gm.boosted = true;
    burst(b.position.x, b.position.y, 14, ['#FACC15','#F97316','#FFFFFF'], 5, 'spark');
  } else if (type==='triple'){
    const v = b.velocity;
    for (const ang of [-0.2, 0.2]){
      const c = Math.cos(ang), s = Math.sin(ang);
      const nb = Bodies.circle(b.position.x, b.position.y, MONKEY.triple.r, { density:0.004, friction:0.6, restitution:0.25, frictionAir:0, sleepThreshold:9999 });
      nb.gm = { kind:'monkey', type:'triple', t0:simTime, slow:0, firstHit:null, used:true, main:false };
      Composite.add(engine.world, nb);
      Body.setVelocity(nb, { x:v.x*c - v.y*s, y:v.x*s + v.y*c });
      projectiles.push(nb);
    }
    burst(b.position.x, b.position.y, 14, ['#6FB0F5','#FFFFFF'], 5, 'spark');
  } else if (type==='bomb'){
    explode(b);
  } else if (type==='gorilla'){
    Body.setVelocity(b, { x:b.velocity.x*0.3, y:26 });
    burst(b.position.x, b.position.y, 10, ['#9C9CAE','#FFFFFF'], 4, 'spark');
  }
}
function explode(b){
  const x = b.position.x, y = b.position.y, R = 200;
  b.gm.dead = true; b.gm.used = true;
  Composite.remove(engine.world, b);
  for (const o of Composite.allBodies(engine.world)){
    if (o.isStatic || o === b) continue;
    const dx = o.position.x - x, dy = o.position.y - y, d = Math.hypot(dx, dy);
    if (d > R) continue;
    const k = 1 - d/R, n = d || 1;
    Sleeping.set(o, false);
    const kick = 16 * k * Math.min(1, 6/Math.max(o.mass, 0.5)) + 3*k;
    Body.setVelocity(o, { x:o.velocity.x + dx/n*kick, y:o.velocity.y + dy/n*kick - 3*k });
    if (o.gm && o.gm.kind !== 'monkey') damage(o, (o.gm.kind==='croc' ? 110 : 190) * k, 10);
  }
  burst(x, y, 40, ['#F97316','#FACC15','#DC2626','#1F2937'], 10, 'boom');
  SND.boom(); shake(10); if (!REDUCE_MOTION) hitStop = 0.08;
}
function physicsStep(){
  Engine.update(engine, STEP);
  simTime += STEP/1000;
  processKills();
  // Aus der Welt gefallen?
  for (const b of [...crocs, ...blocks]){
    const p = b.position;
    if (p.y > H + 150 || p.x < -250 || p.x > W + 300) pendingKill.add(b);
  }
  processKills();
  // Projektile
  for (const b of projectiles){
    if (b.gm.dead) continue;
    const p = b.position;
    if (b.gm.main && ++trailTick % 3 === 0 && b.gm.firstHit == null) trail.push({ x:p.x, y:p.y, big: trail.length % 3 === 0 });
    b.gm.slow = b.speed < 0.35 ? b.gm.slow + 1 : 0;
    if (b.gm.type==='bomb' && !b.gm.used && b.gm.firstHit != null && simTime - b.gm.firstHit > 1.4){ explode(b); continue; }
    const out = p.y > H + 150 || p.x > W + 250 || p.x < -150;
    if (out || b.gm.slow > 45 || simTime - b.gm.t0 > 9){
      b.gm.dead = true; Composite.remove(engine.world, b);
      if (!out){ burst(p.x, p.y, 10, [MONKEY[b.gm.type].fur, MONKEY[b.gm.type].furL, '#FFFFFF'], 4, 'puff'); SND.poof(); }
    }
  }
  projectiles = projectiles.filter(b => !b.gm.dead);
  for (const c of crocs){ if (c.gm.ouch > 0) c.gm.ouch -= STEP/1000; }
}
function worldCalm(){
  for (const b of Composite.allBodies(engine.world)) if (!b.isStatic && !b.isSleeping && b.speed > 0.2) return false;
  return true;
}
function gameStep(dt){
  // Sieg?
  if (crocs.length === 0 && G.phase !== 'won' && G.phase !== 'tally'){ G.phase = 'won'; G.winTimer = 1.2; }
  switch (G.phase){
    case 'between':
      G.timer -= dt;
      if (G.timer <= 0){
        if (G.queue.length) loadNext();
        else { G.phase = 'empty'; G.timer = 0; G.calm = 0; }
      }
      break;
    case 'ready':
      G.loadAnim = Math.min(1, (G.loadAnim||0) + dt/0.35); G.idle += dt;
      break;
    case 'flight':
      if (projectiles.length === 0){ G.phase = 'between'; G.timer = 0.5; }
      break;
    case 'empty':
      G.timer += dt; G.calm = worldCalm() ? G.calm + dt : 0;
      if (G.calm > 0.6 || G.timer > 4) { G.phase = 'question'; askQuestion('reload'); }
      break;
    case 'won':
      G.winTimer -= dt;
      if (G.winTimer <= 0) startTally();
      break;
  }
}
function startTally(){
  G.phase = 'tally';
  const list = [];
  if (G.loaded) list.push(G.loaded);
  list.push(...G.queue);
  const pos = queuePositions(list.length, !!G.loaded);
  list.forEach((t, i) => schedule(0.35*i + 0.2, () => {
    addScore(10000, pos[i].x, pos[i].y - 40, '#9333EA'); SND.coin();
    burst(pos[i].x, pos[i].y, 10, ['#FACC15','#FFFFFF'], 4, 'spark');
  }));
  G.tallied = list.length;
  schedule(0.35*list.length + 0.9, () => { G.queue = []; G.loaded = null; showClear(); });
}
const timers = [];
function schedule(sec, fn){ timers.push({ t:sec, fn }); }

let aim = null;
function toWorld(e){

}
cv.addEventListener('pointerdown', e => {
  audio();

  const p = toWorld(e);
  if (G.phase === 'flight'){ ability(); return; }
  if (G.phase !== 'ready' || G.loadAnim < 1) return;
  const near = Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) < 110 || p.x < 560;
  if (!near) return;
  cv.setPointerCapture(e.pointerId);
  aim = { dx:0, dy:0, id:e.pointerId, start:p };
  cv.classList.add('drag'); SND.stretch();
  moveAim(p);
});
function moveAim(p){
  let dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y;
  const d = Math.hypot(dx, dy);
  if (d > MAXPULL){ dx = dx/d*MAXPULL; dy = dy/d*MAXPULL; }
  if (ANCHOR.y + dy > GROUND - 26) dy = GROUND - 26 - ANCHOR.y;
  aim.dx = dx; aim.dy = dy;
}
cv.addEventListener('pointermove', e => { if (aim && e.pointerId === aim.id) moveAim(toWorld(e)); });
function release(e){

    else if (G.loadAnim < 1){ const k = G.loadAnim, sx = 190, sy = GROUND - r; x = sx + (ANCHOR.x - sx)*k; y = sy + (ANCHOR.y - sy)*k - Math.sin(k*Math.PI)*120; }
    band(c, 268, 616, x + r*0.6, y);
    if (aim) drawAimPreview(c);
    drawMonkey(c, x, y, r, aim ? Math.atan2(-aim.dy, -aim.dx)*0.3 : 0, G.loaded, t, 1);
    band(c, 222, 620, x - r*0.4, y);
  } else {
    band(c, 268, 616, 245, 628); band(c, 222, 620, 245, 628);
  }
  drawSlingFront(c);
  for (const b of projectiles){
    const v = b.velocity;
    drawMonkey(c, b.position.x, b.position.y, MONKEY[b.gm.type].r, b.angle, b.gm.type, t, Math.sign(v.x)||1);
    if (b.gm.boosted && !REDUCE_MOTION){ c.strokeStyle = 'rgba(250,204,21,0.6)'; c.lineWidth = 4;
      for (let i=1;i<4;i++){ c.beginPath(); c.moveTo(b.position.x - v.x*i*1.5, b.position.y - v.y*i*1.5 - 10); c.lineTo(b.position.x - v.x*i*2.5, b.position.y - v.y*i*2.5 - 10); c.stroke(); } }
  }

    c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
    if (p.kind === 'chip'){ c.fillRect(-p.size/2, -p.size/4, p.size, p.size/2); }
    else { c.beginPath(); c.arc(0, 0, p.size*(p.kind==='puff' || p.kind==='boom' ? 0.6 + p.life/p.max : 1), 0, 7); c.fill(); }
    c.restore(); }
  c.globalAlpha = 1;
  // Punkte-Popups
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const p of popups){
    const k = p.life/p.max;
    c.globalAlpha = Math.min(1, k*3);

    c.lineWidth = 6; c.strokeStyle = '#FFFFFF'; c.strokeText(p.txt, p.x, p.y - (1-k)*50);
    c.fillStyle = psy ? NEON[(p.txt.length) % NEON.length] : p.col; c.fillText(p.txt, p.x, p.y - (1-k)*50);
  }

  // Tutorial-Hinweise
  if (G.phase === 'ready' && !aim && G.loadAnim >= 1 && G.shotsFired === 0 && G.pos === 0 && G.stage === 0){
    const k = REDUCE_MOTION ? 0.5 : (t*0.8) % 1;

    pill(c, L().dragHint, ANCHOR.x, ANCHOR.y - 110);

    const b = projectiles.find(p => p.gm.main && !p.gm.used && p.gm.type !== 'normal' && (p.gm.firstHit == null || p.gm.type === 'bomb'));
    if (b) pill(c, L().tapHint + ' 👆', b.position.x, b.position.y - 70);

}
function pill(c, txt, x, y){

function drawAimPreview(c){
  // gleiche Integration wie Matter (Verlet, frictionAir 0): v += g; p += v
  const g = engine.gravity.y * engine.gravity.scale * STEP * STEP;
  let x = ANCHOR.x + aim.dx, y = ANCHOR.y + aim.dy, vx = -aim.dx*POWER, vy = -aim.dy*POWER;
  c.fillStyle = psy ? '#00FFFF' : '#FFFFFF'; c.strokeStyle = 'rgba(31,41,55,0.5)'; c.lineWidth = 2;
  for (let i=1; i<=34; i++){
    vy += g; x += vx; y += vy;
    if (i % 3 === 0){ c.globalAlpha = 1 - i/38; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill(); c.stroke(); }

/* ---------------- LOOP ---------------- */
let last = 0, acc = 0, rafId = null, clock = 0;
function frame(ts){
  rafId = requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(Math.max((now - last)/1000, 0), 0.05); last = now;
  clock += dt; psyT += dt;
  if (G.inGame && !G.paused){
    for (let i=timers.length-1;i>=0;i--){ timers[i].t -= dt; if (timers[i].t <= 0){ const f = timers[i].fn; timers.splice(i,1); f(); } }
    if (hitStop > 0) hitStop -= dt;
    else {
      acc += dt; let n = 0;
      while (acc >= STEP/1000 && n < 4){ physicsStep(); acc -= STEP/1000; n++; }
      if (n === 4) acc = 0;
    }
    if (G.inGame && !G.paused) gameStep(dt);
  }
  // Effekte
  for (const p of POOL){ if (!p.on) continue; p.life += dt; if (p.life >= p.max){ p.on = false; continue; }
    p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; p.vx *= 0.98; }
  for (const p of popups) p.life -= dt;
  popups = popups.filter(p => p.life > 0);
  if (shakeT > 0){ shakeT -= dt; if (shakeT <= 0) shakeAmt = 0; }
  render();
}
function render(){
  if (!bgCanvas) bgFor(0);
  const s = VIEW.s * VIEW.dpr;
  const k = shakeT > 0 ? shakeAmt * (shakeT/0.25) : 0;
  cx.setTransform(s, 0, 0, s, rnd(-k,k)*s, rnd(-k,k)*s);
  if (engine) drawWorld(cx, clock);
  else drawBackground(cx);
  // Konfetti
  const d = VIEW.dpr;
  fx.setTransform(d,0,0,d,0,0); fx.clearRect(0,0,innerWidth,innerHeight);
  for (const p of CONF){ if (!p.on) continue;
    p.life += 1/60; if (p.life > p.max){ p.on = false; continue; }
    p.vy += 900/60; p.x += p.vx/60; p.y += p.vy/60; p.r += p.vr/60;
    fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r); fx.globalAlpha = 1 - p.life/p.max; fx.fillStyle = p.col; fx.fillRect(-p.w/2, -p.h/2, p.w, p.h); fx.restore(); }
}

const decks = {}; let lastType = null, lastQ = null;
function drawQuestion(t){
  const key = G.mode + t, src = TOPICS[t][G.mode];
  if (!decks[key] || !decks[key].length){
    decks[key] = shuffle(src.slice());
    if (decks[key][0] === lastQ && decks[key].length > 1) decks[key].push(decks[key].shift());
  }
  const d = decks[key];
  let i = d.findIndex(q => q[0] !== lastType);
  if (i < 0) i = 0;
  const q = d.splice(i, 1)[0];
  lastType = q[0]; lastQ = q;
  return q;
}
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ').trim().replace(/[.!?]+$/, '').trim();
const KEEP_CAP = new Set(['I','Tom','Lisa','Paul','Sarah','Maria','Vienna','Austria','Graz','Italy','English','French','Spanish','German','Italian','Sundays','September','February','James','Anna','Max','Tina','Jim','Tim','TV']);
function gapHTML(s){ return esc(s).replace('___', '<span class="gap">&nbsp;?&nbsp;</span>'); }
function sceneHTML(pic){
  const [tg, rel, ref] = pic;
  const sp = (e, l, b, size, z=1) => `<span style="left:${l}px;bottom:${b}px;font-size:${size}px;z-index:${z}">${e}</span>`;
  let h = '';
  if (rel === 'on') h = sp(ref, 98, 12, 64) + sp(tg, 106, 68, 48, 2);
  else if (rel === 'under') h = sp(ref, 84, 34, 88) + sp(tg, 110, 8, 36, 0);
  else if (rel === 'next') h = sp(ref, 62, 16, 60) + sp(tg, 140, 16, 52);
  else if (rel === 'above') h = sp(ref, 98, 8, 72) + sp(tg, 112, 104, 36);
  else if (rel === 'between') h = sp(ref, 22, 16, 56) + sp(tg, 106, 16, 48) + sp(ref, 180, 16, 56);
  return `<div class="scene" aria-hidden="true">${h}</div>`;
}
let Qs = null; // aktuelle Frage
function askQuestion(kind){
  G.paused = true;
  const t = topicIdx(), q = drawQuestion(t), Lx = L();
  Qs = { q, kind, t, done:false };
  const head = `<div class="q-head"><span class="chip">${esc(TOPICS[t].name)}</span>${kind==='bonus' ? '<span class="chip pink">⭐ BONUS</span>' : ''}</div>
    <div class="q-reason">${kind==='bonus' ? Lx.bonusQ : Lx.outOf}</div>
    <div class="q-instr">${Lx.instr[q[0]]}</div>`;
  let body = '';
  if (q[0] === 'm'){
    const opts = shuffle([q[2], ...q[3]]);
    body = (q[4] ? sceneHTML(q[4]) : '') + `<div class="q-text">${gapHTML(q[1])}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q[0] === 'o'){
    const s = q[1], end = (s.match(/[.?!]$/) || ['.'])[0];
    const words = s.replace(/[.?!]$/, '').split(' ').map((w, i) => (i === 0 && !KEEP_CAP.has(w)) ? w.charAt(0).toLowerCase() + w.slice(1) : w);
    const accepted = [s, ...(q[2] || [])].map(norm);
    let tiles; let guard = 0;
    do { tiles = shuffle(words.slice()); } while (accepted.includes(norm(tiles.join(' '))) && ++guard < 20);
    Qs.tiles = tiles.map((w, i) => ({ w, i, used:false })); Qs.built = []; Qs.end = end; Qs.accepted = accepted;
    body = `<div class="build" id="build"></div><div class="pool" id="pool"></div>
      <div class="row"><button class="btn ghost" id="undoBtn">${Lx.reset}</button><button class="btn green" id="checkBtn" disabled>${Lx.check}</button></div>`;
  } else {
    body = `<div class="q-text">${gapHTML(q[1])}</div>
      <input class="tin" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(Lx.placeholder)}">
      <div class="row"><button class="btn green" id="checkBtn">${Lx.check}</button></div>`;
  }
  showCard(head + body + `<div class="fb" id="fb"></div>`);
  if (q[0] === 'm'){
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (Qs.done) return;
      const ok = b.dataset.v === q[2];
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) document.querySelectorAll('.opt').forEach(o => { if (o.dataset.v === q[2]) o.classList.add('right'); });
      answer(ok, q[2]);
    });
  } else if (q[0] === 'o'){
    renderOrder();
    $('undoBtn').onclick = () => { if (Qs.done || !Qs.built.length) return; const t2 = Qs.built.pop(); t2.used = false; SND.button(); renderOrder(); };
    $('checkBtn').onclick = () => {
      if (Qs.done) return;
      const s = norm(Qs.built.map(t2 => t2.w).join(' '));
      answer(Qs.accepted.includes(s), q[1]);
    };
  } else {
    const inp = $('tin');
    setTimeout(() => inp.focus(), 50);
    const go = () => { if (Qs.done || !inp.value.trim()) return; answer(q[2].map(norm).includes(norm(inp.value)), q[1].replace('___', q[2][0])); };
    $('checkBtn').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
}
function renderOrder(){
  const b = $('build'), p = $('pool');
  b.innerHTML = Qs.built.map((t, i) => `<button class="tile" data-b="${i}">${esc(t.w)}</button>`).join('') + `<span class="punct">${Qs.end}</span>`;
  p.innerHTML = Qs.tiles.filter(t => !t.used).map(t => `<button class="tile" data-i="${t.i}">${esc(t.w)}</button>`).join('');
  p.querySelectorAll('.tile').forEach(el => el.onclick = () => { if (Qs.done) return; const t = Qs.tiles[+el.dataset.i]; t.used = true; Qs.built.push(t); SND.button(); renderOrder(); });
  b.querySelectorAll('.tile').forEach(el => el.onclick = () => { if (Qs.done) return; const i = +el.dataset.b; const t = Qs.built.splice(i, 1)[0]; t.used = false; SND.button(); renderOrder(); });
  $('checkBtn').disabled = Qs.tiles.some(t => !t.used);
}
function answer(ok, correctTxt){
  Qs.done = true;
  const Lx = L(), t = Qs.t, kind = Qs.kind, card = $('card'), fb = $('fb');
  const st = G.stats[t] || (G.stats[t] = { c:0, n:0 }); st.n++;
  document.querySelectorAll('#card .row').forEach(r => r.style.display = 'none');
  let extra = '';

    st.c++; G.totalCorrect++;
    SND.correct(); confetti(30);
    card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
    extra = kind === 'bonus' ? Lx.bonusOk : Lx.reload3;

  } else {
    SND.wrong();

    if (kind === 'reload'){ G.lives--; G.lostLife = true; const hh = $('hearts'); hh.classList.remove('hit'); void hh.offsetWidth; hh.classList.add('hit'); }
    extra = kind === 'bonus' ? Lx.bonusNo : (G.lives > 0 ? Lx.reload1 : '');
    fb.className = 'fb bad show';
    fb.innerHTML = `<b>${Lx.wrong}</b> ${extra}<br>${Lx.answer}<span class="ans">${esc(correctTxt)}</span><b>${Lx.tip}</b> ${esc(TOPICS[t].tip[G.mode==='ahs'?'en':'de'])}`;
  }
  updateHUD();

  const nb = $('nextBtn'); nb.focus();
  nb.onclick = () => {
    SND.button(); hideCard();

    if (ok){
      const special = G.unlocked.length ? G.unlocked[Math.floor(Math.random()*G.unlocked.length)] : 'normal';
      G.queue.push(special, 'normal', 'normal');

function checkUnlock(){
  const c = G.totalCorrect;
  let type = null;
  if (c === 3) type = 'turbo'; else if (c === 5) type = 'triple'; else if (c === 10) type = 'bomb';
  else if (c >= 15 && (c - 10) % 5 === 0) type = 'gorilla';
  if (!type) return;
  if (SPECIALS.includes(type) && !G.unlocked.includes(type)) G.unlocked.push(type);
  if (G.phase === 'tally' || G.phase === 'won') G.carry.push(type); else G.queue.unshift(type);
  const bn = $('banner');
  bn.innerHTML = `<canvas width="160" height="160" data-monkey="${type}"></canvas><div><b>${L().unlocked}</b><span>${esc(L().sp[type])}</span></div>`;
  paintPortraits(bn);
  bn.classList.remove('show'); void bn.offsetWidth; bn.classList.add('show');
  SND.fanfare(); confetti(50);
  clearTimeout(checkUnlock.tm); checkUnlock.tm = setTimeout(() => bn.classList.remove('show'), 3200);

}

    <h3 style="font-family:var(--font-heading);font-weight:400;margin-bottom:8px">${Lx.review}</h3><div class="rev">${rows}</div>
    <div class="row"><button class="btn ghost" id="mapB">${Lx.mapBtn}</button><button class="btn big green" id="newB">${Lx.newGame}</button></div>`);
  $('mapB').onclick = () => { SND.button(); hideCard(); showMap(); };
  $('newB').onclick = () => { SND.button(); hideCard(); showMenu(); };
}

/* ---------------- MENÜ & KARTE ---------------- */
function showMenu(anim=true){
  G.inGame = false; G.paused = true; hideCard();
  const Lx = L();
  $('menuInner').innerHTML = `
    <div class="title-box"><canvas width="224" height="224" data-monkey="normal"></canvas><div class="game-title">GRUMPY<br>MONKEY</div></div>
    <div class="tagline">${Lx.tagline}</div>
    <div class="panel" style="animation-delay:.08s"><h3>${Lx.mode}</h3>
      <div class="seg"><button data-m="std" class="${G.mode==='std'?'on':''}">${Lx.std}<small>${Lx.stdSub} · Deutsch</small></button>
      <button data-m="ahs" class="${G.mode==='ahs'?'on':''}">${Lx.ahs}<small>${Lx.ahsSub} · English</small></button></div></div>
    <div class="panel" style="animation-delay:.16s"><h3>${Lx.topics}</h3>
      <div class="mini-row"><button class="mini" id="allB">${Lx.all}</button><button class="mini" id="noneB">${Lx.none}</button><span class="warn" id="warn"></span></div>
      <div class="topics">${TOPICS.map((tp, i) => `<div class="topic ${G.selected.includes(i)?'on':''}" data-t="${i}" role="checkbox" tabindex="0" aria-checked="${G.selected.includes(i)}"><span class="num">${i+1}</span>${esc(tp.name)}<span class="chk">${G.selected.includes(i)?'✅':'⬜'}</span></div>`).join('')}</div></div>
    <div class="row" style="animation:slidein .5s .24s var(--ease-pop) both"><button class="btn big green" id="playB">${Lx.play} 🐒</button></div>`;
  paintPortraits($('menuInner'));
  $('menuInner').classList.toggle('noanim', !anim);
  $('menu').classList.add('show');
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { audio(); SND.button(); G.mode = b.dataset.m; showMenu(false); });
  document.querySelectorAll('.topic').forEach(el => {
    const tog = () => { audio(); SND.button(); const i = +el.dataset.t;
      G.selected = G.selected.includes(i) ? G.selected.filter(x => x !== i) : [...G.selected, i].sort((a,b) => a-b); showMenu(false); };
    el.onclick = tog; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } };
  });
  $('allB').onclick = () => { SND.button(); G.selected = TOPICS.map((_, i) => i); showMenu(false); };
  $('noneB').onclick = () => { SND.button(); G.selected = []; showMenu(false); };
  $('playB').onclick = () => {
    audio();
    if (!G.selected.length){ $('warn').textContent = Lx.needOne; SND.wrong(); return; }
    SND.button(); $('menu').classList.remove('show');
    G.score = 0; G.totalCorrect = 0; G.unlocked = []; G.carry = []; G.stats = {}; G.cleared = new Set();
    startStage(G.selected[0], 0, true);
  };
  updateHUD();
}
function showMap(resume){
  G.inGame = false; G.paused = true; const Lx = L(), store = STORE[G.mode];
  const rows = G.selected.map(t => `<div class="map-row"><div class="lbl">${Lx.level} ${t+1}<small>${esc(TOPICS[t].name)}</small></div>
    ${[0,1,2].map(s => { const st = store[t+'-'+s] || 0; return `<button class="sbtn ${st?'done':''}" data-t="${t}" data-s="${s}">${s+1}<small>${'★'.repeat(st)}${'☆'.repeat(3-st)}</small></button>`; }).join('')}</div>`).join('');
  showCard(`<h2>${Lx.map} 🗺️</h2><p style="font-size:16px">${Lx.mapHint}</p><div class="map-grid">${rows}</div>
    <div class="row"><button class="btn ghost" id="menuB">${Lx.menu}</button>${resume ? `<button class="btn big green" id="contB">${Lx.cont}</button>` : ''}</div>`);
  if (resume) $('contB').onclick = () => { SND.button(); hideCard(); G.inGame = true; G.paused = false; };
  document.querySelectorAll('.sbtn').forEach(b => b.onclick = () => { SND.button(); hideCard(); startStage(+b.dataset.t, +b.dataset.s, true); });
  $('menuB').onclick = () => { SND.button(); showMenu(); };
}

/* ---------------- HEADER-BUTTONS ---------------- */
$('backBtn').onclick = () => {
  audio(); SND.button();
  if ($('menu').classList.contains('show')){ if (location.protocol.startsWith('http')) location.href = '../'; return; }
  if (G.inGame){ showMap(!$('ov').classList.contains('show')); return; }
  showMenu();
};
$('muteBtn').onclick = () => { audio(); muted = !muted; $('muteBtn').textContent = muted ? '🔇' : '🔊'; if (!muted) SND.button(); };
$('psyBtn').onclick = () => {
  audio(); psy = !psy;
  document.documentElement.setAttribute('data-theme', psy ? 'psychedelic' : 'standard');
  $('psyBtn').textContent = psy ? '🔮' : '🌈';
  if (psy){ SND.ability(); confetti(40); shake(8); } else SND.button();
  paintPortraits(document);
};

/* ---------------- START ---------------- */
function boot(){
  if (!window.Matter){ document.body.innerHTML = '<p style="padding:32px;font-size:20px">Die Physik-Bibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und neu laden.</p>'; return; }
  resize(); bgFor(0); updateHUD();
  rafId = rafId || requestAnimationFrame(frame);
  setTimeout(() => { $('splash').classList.remove('show'); showMenu(); }, 1000);
}
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot); else boot();
</script>
<!-- lernspiele:stats-start -->
<script>
(function () {
  var h = location.hostname;
  if (location.protocol === "file:" || h === "localhost" || h === "127.0.0.1") return;
  var CODE = "spor-tler";
  var GAME = "grumpy-monkey";
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://" + CODE + ".goatcounter.com/count");
  document.head.appendChild(s);
  // Spielzeit: sichtbare Sekunden zählen, bei Meilensteinen je 1 Event senden.
  var MEILENSTEINE = [1, 3, 5, 10, 15, 20]; // Minuten
  var sichtbar = 0, gesendet = 0;
  setInterval(function () {
    if (document.visibilityState !== "visible") return;
    sichtbar += 10;
    while (gesendet < MEILENSTEINE.length && sichtbar >= MEILENSTEINE[gesendet] * 60) {
      var min = MEILENSTEINE[gesendet++];
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({
          path: "zeit/" + GAME + "/" + min + "min",
          title: "Spielzeit " + GAME + ": " + min + " min",
          event: true
        });
      }
    }
  }, 10000);
})();
</script>
<!-- lernspiele:stats-end -->
